name: Feature request
description: Suggest something the tool should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behaviour
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works from screen pixels only, with no game memory access or injection.
          required: true
