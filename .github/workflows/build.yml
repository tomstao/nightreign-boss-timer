name: Build

# Builds the Windows program and its ZIP.
# - On a pull request that touches packaging: to prove the build still works.
# - By hand, from the Actions tab: to get a ZIP of any branch.
# - On a version tag such as v0.1.0: the ZIP is attached to a draft release, which a
#   maintainer checks and publishes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - tools/build_exe.py
      - packaging/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows program
    runs-on: windows-latest
    permissions:
      contents: write # to attach the ZIP to a draft release when a tag is pushed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c 'from importlib.metadata import version; print(version("nightreign-boss-timer"))')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Cache the OCR model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nbt-models
          key: ocr-model-${{ hashFiles('src/nightreign_boss_timer/ocr.py') }}
      - name: Fetch the OCR model
        run: uv run python tools/fetch_model.py
        env:
          NBT_MODEL_DIR: ${{ runner.temp }}/nbt-models
      - name: Build, self-test and pack
        run: uv run python tools/build_exe.py
        env:
          NBT_MODEL_DIR: ${{ runner.temp }}/nbt-models
      - name: Show the program's log if the build failed
        if: failure()
        shell: bash
        run: cat "$LOCALAPPDATA/nightreign-boss-timer/logs/app.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightreign-boss-timer-windows
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach the ZIP to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
