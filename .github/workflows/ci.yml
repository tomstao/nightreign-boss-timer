name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python }})
    # The tool is Windows-only, so tests run where it runs.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev
      - name: Cache the OCR model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/nbt-models
          # The checksum lives in ocr.py, so a model change makes a new cache entry.
          key: ocr-model-${{ hashFiles('src/nightreign_boss_timer/ocr.py') }}
      - name: Fetch the OCR model
        run: uv run python tools/fetch_model.py
        env:
          NBT_MODEL_DIR: ${{ runner.temp }}/nbt-models
      - run: uv run pytest
        env:
          NBT_MODEL_DIR: ${{ runner.temp }}/nbt-models
